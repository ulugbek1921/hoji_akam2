<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Янги Товар Қўшиш</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts & Tailwind CSS (Замонавий дизайн учун) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f6f9);
            color: var(--tg-theme-text-color, #232323);
        }
    </style>
</head>
<body class="p-4 antialiased">

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">
        
        <!-- Сарлавҳа -->
        <div class="text-center">
            <h2 class="text-xl font-bold text-gray-800">📦 Янги Товар Кирими</h2>
            <p class="text-xs text-gray-500 mt-1">Складга янги маҳсулот қўшиш формаси</p>
        </div>

        <form id="productForm" class="space-y-4">
            
            <!-- Товар Номи -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Товар номи</label>
                <input type="text" id="name" required placeholder="Масалан: Гилам Бўйра" 
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all">
            </div>

            <!-- Миқдори -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Миқдори (Метр / Дона)</label>
                <input type="number" id="quantity" required placeholder="0" 
                       class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all">
            </div>

            <!-- Икки устунли блок: Келиш Нархи ва Устама -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Келиш Нархи (сўм)</label>
                    <input type="text" id="incoming_price_input" required placeholder="0" 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all text-right font-medium">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Устама (%)</label>
                    <input type="number" id="markup_percent" required placeholder="0" 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-all text-center">
                </div>
            </div>

            <!-- Сотилиш Нархи (Автоматик ва Чиройли) -->
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex justify-between items-center">
                <div>
                    <span class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Сотилиш Нархи:</span>
                    <span id="selling_price_display" class="text-lg font-bold text-green-600">0 сўм</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-gray-400 block">Соф фойда / м</span>
                    <span id="profit_display" class="text-xs font-semibold text-blue-600">0 сўм</span>
                </div>
            </div>

            <!-- QR-Код Сканер Блоки -->
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Штрих / QR Код</label>
                <div class="flex gap-2">
                    <input type="text" id="qr_code" readonly placeholder="Сканер қилинмаган" 
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-xs font-mono text-gray-600 focus:outline-none">
                    <button type="button" id="scanBtn" 
                            class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-medium flex items-center gap-1 transition-colors whitespace-nowrap shadow-sm">
                        📷 Сканер
                    </button>
                </div>
            </div>

            <!-- Сақлаш Тугмаси -->
            <button type="submit" 
                    class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-md mt-2">
                💾 Базага Сақлаш
            </button>

        </form>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Ойнани тўлиқ экранга очади

        // Элементларни оламиз
        const incPriceInput = document.getElementById('incoming_price_input');
        const markupInput = document.getElementById('markup_percent');
        const sellingPriceDisplay = document.getElementById('selling_price_display');
        const profitDisplay = document.getElementById('profit_display');
        const qrInput = document.getElementById('qr_code');
        const scanBtn = document.getElementById('scanBtn');
        const form = document.getElementById('productForm');

        // Рақамни мингликка ажратиш функцияси (Масалан: 1000000 -> "1 000 000")
        function formatNumber(value) {
            let num = value.replace(/\D/g, ""); // Фақат рақамларни қолдириш
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, " "); // Мингликка ажратиш
        }

        // Ажратилган матндан тоза рақамни қайтариш (Масалан: "1 000 000" -> 1000000)
        function getCleanNumber(value) {
            return parseFloat(value.replace(/\s/g, '')) || 0;
        }

        // Мингликка ажратиш воқелиги
        incPriceInput.addEventListener('input', (e) => {
            let cursorPosition = e.target.selectionStart;
            let originalLength = e.target.value.length;
            
            e.target.value = formatNumber(e.target.value);
            
            // Курсор позициясини тўғирлаш
            let newLength = e.target.value.length;
            cursorPosition = cursorPosition + (newLength - originalLength);
            e.target.setSelectionRange(cursorPosition, cursorPosition);
            
            calculatePrices();
        });

        markupInput.addEventListener('input', calculatePrices);

        // Нархларни ҳисоблаш
        function calculatePrices() {
            const incomingPrice = getCleanNumber(incPriceInput.value);
            const markupPercent = parseFloat(markupInput.value) || 0;

            const sellingPrice = incomingPrice + (incomingPrice * (markupPercent / 100));
            const profit = sellingPrice - incomingPrice;

            // Минглик форматида экранга чиқариш
            sellingPriceDisplay.textContent = new Intl.NumberFormat('ru-RU').format(Math.round(sellingPrice)) + " сўм";
            profitDisplay.textContent = new Intl.NumberFormat('ru-RU').format(Math.round(profit)) + " сўм";
        }

        // Telegram Камераси орқали QR код сканерлаш
        scanBtn.addEventListener('click', () => {
            if (tg.showScanQrPopup) {
                tg.showScanQrPopup({ text: "Товарнинг штрих ёки QR кодини сканерланг" }, function(text) {
                    qrInput.value = text;
                    tg.closeScanQrPopup();
                });
            } else {
                alert("QR Сканер фақат мобил қурилмадаги Telegram иловасида ишлайди.");
            }
        });

        // Форма юборилганда ботга маълумотни жўнатиш
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const incomingPrice = getCleanNumber(incPriceInput.value);
            const markupPercent = parseFloat(markupInput.value) || 0;
            const sellingPrice = incomingPrice + (incomingPrice * (markupPercent / 100));

            const data = {
                action: "add_product",
                name: document.getElementById('name').value,
                quantity: parseInt(document.getElementById('quantity').value) || 0,
                incoming_price: incomingPrice,
                markup_percent: markupPercent,
                selling_price: Math.round(sellingPrice),
                qr_code: qrInput.value || "NO_QR"
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
